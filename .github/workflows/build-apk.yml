name: Zbuduj Flet APK

on:
  workflow_dispatch:

# Workflow tylko czyta kod - nie potrzebuje praw zapisu do repozytorium.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobranie kodu repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Konfiguracja Java / Android SDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache dla zaleznosci Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Instalacja bibliotek i narzedzia Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet-cli==0.85.3
          pip install -e .

      - name: Przygotowanie ikony aplikacji (jesli istnieje)
        run: |
          mkdir -p assets
          if [ -f .github/assets/app_icon.png ]; then
            cp .github/assets/app_icon.png assets/icon.png
          fi

      # Bez poprawnego klucza Flet po cichu podpisuje APK losowym kluczem debug,
      # przez co kazda aktualizacja wymaga odinstalowania aplikacji. Dlatego
      # przerywamy build, jesli ktoregos sekretu brakuje.
      - name: Sprawdzenie sekretow podpisu
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          brak=""
          for nazwa in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!nazwa}" ]; then brak="$brak $nazwa"; fi
          done
          if [ -n "$brak" ]; then
            echo "::error::Brak sekretow w Settings > Secrets and variables > Actions:$brak"
            exit 1
          fi

      - name: Przygotowanie klucza Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Budowanie APK dla Androida z podpisem
        env:
          CI: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Nazwy zmiennych zgodne z flet-cli 0.85.x (flet build --help)
          FLET_ANDROID_SIGNING_KEY_STORE: ${{ runner.temp }}/release.keystore
          FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          FLET_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          yes | flet build apk --project "OCRTurbo" --description "Skaner PZ do EDI i inne" --arch arm64-v8a -v

      - name: Usuniecie klucza z dysku runnera
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Zapisanie pliku APK jako Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OCRTurbo-Android-APK
          path: build/apk/*.apk
          if-no-files-found: error
